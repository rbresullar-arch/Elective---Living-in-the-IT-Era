<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT and ICT Activities</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #000000;
    font-family: Georgia, 'Times New Roman', serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 16px 80px;
    line-height: 1.5;
  }
  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 24px;
  }
  .section { display: none; }
  .section.active { display: block; }

  #nameForm {
    text-align: center;
  }
  #nameForm label {
    display: block;
    font-size: 15px;
    margin-bottom: 10px;
  }
  #nameInput {
    font-family: Georgia, serif;
    font-size: 15px;
    padding: 8px 10px;
    border: 1.5px solid #000;
    width: 260px;
    max-width: 80%;
  }
  button {
    font-family: Georgia, serif;
    font-size: 16px;
    padding: 10px 26px;
    background: #000;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  button:active { background: #333; }

  #greeting {
    text-align: center;
    font-size: 15px;
    margin-bottom: 30px;
  }

  .activity-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    border: 1.5px solid #000;
    padding: 16px;
    margin-bottom: 14px;
  }
  .activity-row a.activity-btn,
  .activity-row button.activity-btn {
    font-family: Georgia, serif;
    font-size: 16px;
    padding: 10px 26px;
    background: #000;
    color: #fff;
    text-decoration: none;
    display: inline-block;
    border: none;
  }
  .activity-row button.activity-btn:disabled {
    background: #999;
    cursor: default;
  }
  .status {
    font-size: 14px;
    min-width: 140px;
    text-align: left;
  }
  .status.done { color: #000; }
  .status.pending { color: #777; }
  #blockOverlay {
    display: none;
    text-align: center;
    padding: 60px 20px;
    font-size: 16px;
  }
  #blockOverlay strong {
    display: block;
    font-size: 19px;
    margin-bottom: 12px;
  }

  .tab-bar {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-bottom: 24px;
    border-bottom: 1.5px solid #000;
  }
  .tab-bar button {
    background: #fff;
    color: #000;
    border: 1.5px solid #000;
    border-bottom: none;
    padding: 8px 22px;
    font-size: 15px;
    margin: 0 2px -1.5px 2px;
  }
  .tab-bar button.active {
    background: #000;
    color: #fff;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>
</head>
<body>

<h1>IT and ICT Activities</h1>

<div id="blockOverlay">
  <strong>This activity requires Google Chrome on Android.</strong>
  Please open this page in Google Chrome and try again.
</div>

<!-- NAME CAPTURE -->
<div class="section active" id="section-name">
  <form id="nameForm">
    <label for="nameInput">Enter your full name to begin:</label>
    <input type="text" id="nameInput" required>
    <div style="margin-top:16px;">
      <button type="submit">Continue</button>
    </div>
  </form>
</div>

<!-- ACTIVITY LIST -->
<div class="section" id="section-activities">
  <div id="greeting"></div>

  <div class="tab-bar">
    <button type="button" class="tab-link active" data-tab="tab-activities">Activities</button>
    <button type="button" class="tab-link" data-tab="tab-reads">Reads</button>
  </div>

  <div class="tab-panel active" id="tab-activities">
    <div class="activity-row">
      <a class="activity-btn" href="it_ict_sentence_order_v2.html">Activity 1</a>
      <span class="status" id="activity1Status">Checking...</span>
    </div>

    <div class="activity-row">
      <a class="activity-btn" id="activity2Btn" href="abacus_addition_activity.html">Activity 2</a>
      <span class="status" id="activity2Status">Checking...</span>
    </div>

    <div class="activity-row">
      <a class="activity-btn" id="activity3Btn" href="pascaline.html">Activity 3</a>
      <span class="status" id="activity3Status">Checking...</span>
    </div>

    <div class="activity-row" id="redoRow" style="display:none;">
      <button type="button" class="activity-btn" id="redoBtn" style="cursor:pointer;">Redo Fast Play</button>
      <span class="status" id="redoStatus"></span>
    </div>
  </div>

  <div class="tab-panel" id="tab-reads">
    <div class="activity-row">
      <a class="activity-btn" href="prelim_ITEra.html">Prelim Read</a>
    </div>
    <div class="activity-row">
      <a class="activity-btn" href="midterm_ITEra.html">Midterm Read</a>
    </div>
    <div class="activity-row">
      <a class="activity-btn" href="prefinals_ITEra.html">Prefinals Read</a>
    </div>
    <div class="activity-row">
      <a class="activity-btn" href="finals_ITEra.html">Finals Read</a>
    </div>
  </div>
</div>

<script>
const NAME_KEY = 'itict_student_name';
const DATE_KEY = 'itict_created_date';

const RESULT_KEY = 'itict_essay_result';
const RESULT_COOKIE = 'itict_essay_result';
const IDB_NAME = 'itict_db';
const IDB_STORE = 'results';
const IDB_KEY = 'result';

const RESULT2_KEY = 'itict_abacus_result';
const RESULT2_COOKIE = 'itict_abacus_result';
const IDB_KEY2 = 'abacus_result';

const RESULT3_KEY = 'itict_pascaline_result';
const RESULT3_COOKIE = 'itict_pascaline_result';
const IDB_KEY3 = 'pascaline_result';
const REDO_FLAG_KEY = 'itict_pascaline_redo_used';

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}

async function idbDelete(key) {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const req = tx.objectStore(IDB_STORE).delete(key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => resolve(false);
    });
  } catch (e) { return false; }
}

function deleteCookie(name) {
  document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
}

async function clearActivity3Result() {
  try { localStorage.removeItem(RESULT3_KEY); } catch (e) {}
  try { sessionStorage.removeItem(RESULT3_KEY); } catch (e) {}
  deleteCookie(RESULT3_COOKIE);
  await idbDelete(IDB_KEY3);
}

async function loadActivity1Result() {
  let record = null;
  const lsRaw = localStorage.getItem(RESULT_KEY);
  if (lsRaw) { try { record = JSON.parse(lsRaw); } catch (e) {} }
  if (!record) {
    const cookieRaw = getCookie(RESULT_COOKIE);
    if (cookieRaw) { try { record = JSON.parse(cookieRaw); } catch (e) {} }
  }
  if (!record) {
    record = await idbGet(IDB_KEY);
  }
  return record;
}

async function loadActivity2Result() {
  let record = null;
  const lsRaw = localStorage.getItem(RESULT2_KEY);
  if (lsRaw) { try { record = JSON.parse(lsRaw); } catch (e) {} }
  if (!record) {
    const cookieRaw = getCookie(RESULT2_COOKIE);
    if (cookieRaw) { try { record = JSON.parse(cookieRaw); } catch (e) {} }
  }
  if (!record) {
    record = await idbGet(IDB_KEY2);
  }
  return record;
}

async function loadActivity3Result() {
  let record = null;
  const lsRaw = localStorage.getItem(RESULT3_KEY);
  if (lsRaw) { try { record = JSON.parse(lsRaw); } catch (e) {} }
  if (!record) {
    const cookieRaw = getCookie(RESULT3_COOKIE);
    if (cookieRaw) { try { record = JSON.parse(cookieRaw); } catch (e) {} }
  }
  if (!record) {
    record = await idbGet(IDB_KEY3);
  }
  return record;
}

document.querySelectorAll('.tab-link').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-link').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function refreshActivity1Status() {
  const statusEl = document.getElementById('activity1Status');
  const record = await loadActivity1Result();
  if (record) {
    const pct = Math.round((record.totalScore / record.totalMax) * 100);
    statusEl.textContent = `Score: ${record.totalScore}/${record.totalMax} (${pct}%)`;
    statusEl.className = 'status done';
  } else {
    statusEl.textContent = 'Not yet attempted';
    statusEl.className = 'status pending';
  }
}

async function refreshActivity2Status() {
  const statusEl = document.getElementById('activity2Status');
  const btnEl = document.getElementById('activity2Btn');
  const act1Record = await loadActivity1Result();
  if (!act1Record) {
    statusEl.textContent = 'Locked — complete Activity 1 first';
    statusEl.className = 'status pending';
    btnEl.removeAttribute('href');
    btnEl.style.opacity = '0.4';
    btnEl.style.cursor = 'default';
    return;
  }
  btnEl.setAttribute('href', 'abacus_addition_activity.html');
  btnEl.style.opacity = '';
  btnEl.style.cursor = '';
  const record = await loadActivity2Result();
  if (record) {
    statusEl.textContent = `Score: ${record.score}/${record.maxScore} (${record.percentage}%)`;
    statusEl.className = 'status done';
  } else {
    statusEl.textContent = 'Not yet attempted';
    statusEl.className = 'status pending';
  }
}

async function refreshActivity3Status() {
  const statusEl = document.getElementById('activity3Status');
  const btnEl = document.getElementById('activity3Btn');
  const act1Record = await loadActivity1Result();
  const act2Record = await loadActivity2Result();
  if (!act1Record || !act2Record) {
    statusEl.textContent = 'Locked — complete Activities 1 & 2 first';
    statusEl.className = 'status pending';
    btnEl.removeAttribute('href');
    btnEl.style.opacity = '0.4';
    btnEl.style.cursor = 'default';
    return;
  }
  btnEl.setAttribute('href', 'pascaline.html');
  btnEl.style.opacity = '';
  btnEl.style.cursor = '';
  const record = await loadActivity3Result();
  if (record) {
    const max = record.maxScore || 100;
    const pct = record.percentage != null ? record.percentage : Math.round((record.score / max) * 100);
    statusEl.textContent = `Score (Fast Play): ${record.score}/${max} (${pct}%)`;
    statusEl.className = 'status done';
  } else {
    statusEl.textContent = 'Not yet attempted';
    statusEl.className = 'status pending';
  }
}

async function refreshRedoButton() {
  const row = document.getElementById('redoRow');
  const btn = document.getElementById('redoBtn');
  const st = document.getElementById('redoStatus');
  const used = localStorage.getItem(REDO_FLAG_KEY) === '1';
  const record = await loadActivity3Result();

  // Only relevant once a Fast Play score exists.
  if (!record && !used) {
    row.style.display = 'none';
    return;
  }
  row.style.display = '';

  if (used) {
    btn.disabled = true;
    st.textContent = 'Redo already used';
    st.className = 'status pending';
    return;
  }
  if (record) {
    btn.disabled = false;
    st.textContent = 'One redo available';
    st.className = 'status pending';
  } else {
    row.style.display = 'none';
  }
}

document.getElementById('redoBtn').addEventListener('click', async () => {
  if (localStorage.getItem(REDO_FLAG_KEY) === '1') return;
  const btn = document.getElementById('redoBtn');
  btn.disabled = true;
  await clearActivity3Result();
  localStorage.setItem(REDO_FLAG_KEY, '1');
  await refreshActivity3Status();
  await refreshRedoButton();
});

function enterActivities(name) {
  document.getElementById('greeting').textContent = `Hello, ${name}!`;
  showSection('section-activities');
  refreshActivity1Status();
  refreshActivity2Status();
  refreshActivity3Status();
  refreshRedoButton();
}

document.getElementById('nameForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  localStorage.setItem(NAME_KEY, name);
  if (!localStorage.getItem(DATE_KEY)) {
    localStorage.setItem(DATE_KEY, new Date().toISOString());
  }
  enterActivities(name);
});

function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}
function isChrome() {
  const ua = navigator.userAgent;
  return /Chrome\//.test(ua) && !/(SamsungBrowser|OPR\/|Edg\/|EdgA\/|Firefox|FxiOS|UCBrowser|MiuiBrowser|HeyTapBrowser|VivoBrowser)/i.test(ua);
}
const browserBlocked = isAndroid() && !isChrome();

/* On load: if name already saved, skip the name form */
(function init() {
  if (browserBlocked) {
    document.getElementById('blockOverlay').style.display = 'block';
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    return;
  }
  const savedName = localStorage.getItem(NAME_KEY);
  if (savedName) {
    enterActivities(savedName);
  }
})();
</script>

</body>
</html>
