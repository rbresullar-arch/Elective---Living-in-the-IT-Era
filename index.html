<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living in the IT Era</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --blue: #3b6690;
    --yellow: #fbb52f;
    --coral: #ff6f4f;
    --cream: #fdf3dc;
    --green: #bde3b8;
    --cyan: #4fd3e3;
    --white: #fff;
    --bw: 4px;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--blue); }
  body {
    margin: 0;
    color: var(--ink);
    font-family: 'League Spartan', 'Nunito', 'Segoe UI', system-ui, sans-serif;
    padding: 0;
    min-height: 100vh;
  }
  button, input { font-family: inherit; color: var(--ink); }
  a { color: var(--ink); }
  :focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }

  /* Phone-style panel */
  .panel {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 22px 18px 40px;
    background: var(--blue);
    transition: background-color .25s;
  }
  .panel > .screen,
  .panel > #blockOverlay {
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
  .panel.blue   { background: var(--blue); }
  .panel.yellow { background: var(--yellow); }
  .panel.coral  { background: var(--coral); }
  .panel.cream  { background: var(--cream); }

  .screen { display: none; }
  .screen.active { display: block; }

  .box {
    border: var(--bw) solid var(--ink);
    border-radius: 18px;
  }

  /* Title / header pill */
  .title {
    display: block;
    width: 100%;
    background: var(--white);
    text-align: center;
    font-size: 23px;
    font-weight: 800;
    padding: 11px 12px 8px;
    position: relative;
  }
  button.title { cursor: pointer; }
  .title .chev {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-52%);
    font-size: 28px;
    line-height: 1;
  }
  .greeting {
    color: var(--white);
    text-align: center;
    font-size: 15px;
    font-weight: 500;
    margin: 10px 0 0;
    min-height: 18px;
  }

  /* Home menu */
  .menu-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 24px 12px 20px;
    font-size: 23px;
    font-weight: 800;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .menu-btn.yellow { background: var(--yellow); }
  .menu-btn.coral  { background: var(--coral); }
  .menu-btn.cream  { background: var(--cream); }
  .menu-btn:active { transform: translateY(2px); }

  .small-row {
    display: flex;
    justify-content: space-between;
    margin-top: 22px;
  }
  .small-btn {
    padding: 10px 18px 7px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
  }
  #saveBtn   { background: var(--green); }
  #updateBtn { background: var(--cyan); font-size: 17px; }
  .small-btn:active { transform: translateY(2px); }

  #syncStatus {
    color: var(--white);
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
  }
  #syncStatus.error { color: #ffd2c7; }

  .tools {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--white);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 2px;
  }
  #folderLabel {
    color: #d6e3ef;
    font-size: 12px;
    text-align: center;
  }

  /* Activity rows */
  .caption {
    font-size: 13px;
    font-weight: 700;
    margin: 14px 0 3px 4px;
  }
  .row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }
  .row + .note + .row { margin-top: 0; }
  .score {
    flex: 0 0 58px;
    min-height: 58px;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
  }
  .pill {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--white);
    padding: 0 0 0 14px;
    font-size: 20px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    text-align: left;
  }
  .pill-label { padding-top: 3px; }
  .pill-end {
    flex: 0 0 62px;
    align-self: stretch;
    margin: calc(-1 * var(--bw)) calc(-1 * var(--bw)) calc(-1 * var(--bw)) 8px;
    border: var(--bw) solid var(--ink);
    border-radius: 18px;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
  }
  .pill.done .pill-end { background: var(--green); }
  .pill.locked { opacity: .5; cursor: default; }
  .pill:not(.locked):active { transform: translateY(2px); }
  .note {
    font-size: 12.5px;
    font-weight: 500;
    margin: 4px 0 12px 70px;
    min-height: 15px;
  }
  .reads .pill { justify-content: center; padding: 18px 12px 14px; margin-top: 16px; }

  /* Name form + block */
  .name-box {
    background: var(--white);
    margin-top: 24px;
    padding: 20px 16px;
    text-align: center;
  }
  .name-box label { display: block; font-size: 17px; font-weight: 700; margin-bottom: 12px; }
  #nameInput {
    width: 100%;
    font-size: 17px;
    padding: 10px 12px 7px;
    border: var(--bw) solid var(--ink);
    border-radius: 14px;
  }
  .name-box .small-btn { margin-top: 16px; background: var(--yellow); }

  #blockOverlay {
    display: none;
    background: var(--white);
    margin-top: 24px;
    padding: 24px 16px;
    text-align: center;
    font-size: 16px;
  }
  #blockOverlay strong { display: block; font-size: 19px; margin-bottom: 10px; }

  @media (prefers-reduced-motion: reduce) {
    .panel { transition: none; }
  }
</style>
</head>
<body>

<main class="panel blue" id="panel">

  <div class="box" id="blockOverlay">
    <strong>This activity requires Google Chrome on Android.</strong>
    Open this page in Google Chrome and try again.
  </div>

  <!-- NAME -->
  <section class="screen active" id="screen-name">
    <div class="box title">Living in the IT Era</div>
    <form class="box name-box" id="nameForm">
      <label for="nameInput">Enter your full name to begin</label>
      <input type="text" id="nameInput" required autocomplete="name">
      <button type="submit" class="box small-btn">Continue</button>
    </form>
  </section>

  <!-- HOME -->
  <section class="screen" id="screen-home">
    <div class="box title">Living in the IT Era</div>
    <p class="greeting" id="greeting"></p>

    <button type="button" class="box menu-btn yellow" data-go="activities">Activities</button>
    <button type="button" class="box menu-btn coral" data-go="exam">Examination</button>
    <button type="button" class="box menu-btn cream" data-go="reads">Reads</button>

    <div class="small-row">
      <button type="button" class="box small-btn" id="saveBtn">Save</button>
      <button type="button" class="box small-btn" id="updateBtn">Update</button>
    </div>
    <input type="file" id="updateFileInput" accept="application/json" style="display:none;">
    <div id="syncStatus"></div>

    <div class="tools">
      <button type="button" class="link-btn" id="chooseFolderBtn">Choose sync folder</button>
      <span id="folderLabel">No folder set — Save/Update will use file dialogs.</span>
      <button type="button" class="link-btn" id="saveOfflineBtn">Save offline copy</button>
    </div>
  </section>

  <!-- ACTIVITIES (rows built from ACTIVITIES config) -->
  <section class="screen" id="screen-activities">
    <button type="button" class="box title" data-go="home"><span class="chev" aria-hidden="true">‹</span>Activities</button>
    <div class="caption">Score</div>
    <div id="activityList"></div>
  </section>

  <!-- EXAMINATION (rows built from EXAMS config) -->
  <section class="screen" id="screen-exam">
    <button type="button" class="box title" data-go="home"><span class="chev" aria-hidden="true">‹</span>Examination</button>
    <div class="caption">Status</div>
    <div id="examList"></div>
  </section>

  <!-- READS (buttons built from READS config) -->
  <section class="screen reads" id="screen-reads">
    <button type="button" class="box title" data-go="home"><span class="chev" aria-hidden="true">‹</span>Reads</button>
    <div id="readList"></div>
  </section>

</main>

<script>
/* =====================================================================
   CONFIG — edit only this block to add/remove items.
   ---------------------------------------------------------------------
   ACTIVITIES: one line per activity. Minimum: { href: 'file.html' }
     Defaults for activity #N (1-based position in the list):
       label    'Activity N'
       key      'itict_activityN_result'   (localStorage + cookie name)
       idbKey   'activityN_result'         (IndexedDB 'itict_db' / 'results')
       requires [N-1]                      (unlocks after previous activity)
     The activity page must save its result under `key`/`idbKey` with
     { score, maxScore, percentage } or { totalScore, totalMax }.
     Optional: note: r => 'text'   custom line under the row
               score: r => 'text'  custom text in the score box (default: %)
               requires: [1, 2]    activity numbers that must be done first
               redo: { label, flagKey }   one-time redo button

   EXAMS: minimum { label, href, prefix }
     prefix must match the exam page's CFG.prefix (reads prefix_session /
     prefix_result from IndexedDB 'itict_exam' / 'kv').

   READS: { label, href }
   ===================================================================== */

const ACTIVITIES = [
  { label: 'Activity 1', href: 'it_ict_sentence_order_v2.html', key: 'itict_essay_result', idbKey: 'result' },
  { label: 'Activity 2', href: 'abacus_addition_activity.html', key: 'itict_abacus_result', idbKey: 'abacus_result' },
  { label: 'Activity 3', href: 'pascaline.html', key: 'itict_pascaline_result', idbKey: 'pascaline_result',
    requires: [1, 2],
    note: r => `Fast Play: ${r.score}/${r.maxScore || 100}`,
    redo: { label: 'Redo Fast Play', flagKey: 'itict_pascaline_redo_used' } },
  { label: 'Activity 4', href: 'binary_activity.html', key: 'itict_binary_result', idbKey: 'binary_result',
    note: r => `${r.score} pts, ${r.solved} solved` },
  { label: 'Activity 5', href: 'packet_relay.html',
    note: r => `Retries: ${r.retries || 0} · Best time ${r.bestTimeText || '—'}` },
  { label: 'Activity 6', href: 'packet_auto.html',
    score: r => r.bestTimeText || '—',
    note: r => `Runs: ${r.runs || 1} · Best ${r.bestTimeText || '—'}` },
];

const EXAMS = [
  { label: 'Midterm', href: 'midterm_exam_ITEra.html', prefix: 'itict_midterm' },
  // { label: 'Finals', href: 'finals_exam_ITEra.html', prefix: 'itict_finals' },
];

const READS = [
  { label: 'Prelim',    href: 'prelim_ITEra.html' },
  { label: 'Midterm',   href: 'midterm_ITEra.html' },
  { label: 'Prefinals', href: 'prefinals_ITEra.html' },
  { label: 'Finals',    href: 'finals_ITEra.html' },
];

/* ======================= END OF CONFIG ======================= */

const NAME_KEY = 'itict_student_name';
const DATE_KEY = 'itict_created_date';
const SCREEN_KEY = 'itict_last_screen';

const IDB_NAME = 'itict_db';
const IDB_STORE = 'results';
const EXAM_IDB_NAME = 'itict_exam';
const EXAM_IDB_STORE = 'kv';

const SYNC_KEY = 'ITEra2026';
const SYNC_TIMESTAMP_KEY = 'itict_last_update_ts';
const SYNC_FILENAME = 'itict_sync.json';
const SYNC_DIR_HANDLE_KEY = 'sync_dir_handle';

/* ===== Normalize config ===== */
ACTIVITIES.forEach((a, i) => {
  const n = i + 1;
  a.n = n;
  a.id = a.id || `activity${n}`;
  a.label = a.label || `Activity ${n}`;
  a.key = a.key || `itict_${a.id}_result`;
  a.cookie = a.cookie || a.key;
  a.idbKey = a.idbKey || `${a.id}_result`;
  a.requires = (a.requires || (n > 1 ? [n - 1] : [])).filter(r => r >= 1 && r <= ACTIVITIES.length && r !== n);
  if (a.redo) {
    a.redo.label = a.redo.label || `Redo ${a.label}`;
    a.redo.flagKey = a.redo.flagKey || `itict_${a.id}_redo_used`;
  }
});
EXAMS.forEach((e, i) => {
  e.id = e.id || `exam${i + 1}`;
  e.label = e.label || `Exam ${i + 1}`;
  e.prefix = e.prefix || `itict_${e.id}`;
});

/* ===== Build UI from config ===== */
function el(tag, cls, text) {
  const x = document.createElement(tag);
  if (cls) x.className = cls;
  if (text != null) x.textContent = text;
  return x;
}

function buildRow(item, scoreText) {
  const wrap = el('div');
  const row = el('div', 'row');
  const score = el('div', 'box score', scoreText || '—');
  score.id = item.id + 'Score';
  const btn = el('a', 'box pill');
  btn.id = item.id + 'Btn';
  btn.href = item.href;
  const label = el('span', 'pill-label', item.label);
  label.id = item.id + 'Label';
  const end = el('span', 'pill-end', '›');
  end.id = item.id + 'End';
  btn.append(label, end);
  row.append(score, btn);
  const note = el('div', 'note', 'Checking...');
  note.id = item.id + 'Note';
  wrap.append(row, note);
  return wrap;
}

function buildRedoRow(a) {
  const wrap = el('div');
  wrap.id = a.id + 'RedoRow';
  wrap.style.display = 'none';
  const row = el('div', 'row');
  row.append(el('div', 'box score', '↺'));
  const btn = el('button', 'box pill');
  btn.type = 'button';
  btn.id = a.id + 'RedoBtn';
  const end = el('span', 'pill-end', '1');
  end.id = a.id + 'RedoEnd';
  btn.append(el('span', 'pill-label', a.redo.label), end);
  btn.addEventListener('click', () => doRedo(a));
  row.append(btn);
  const note = el('div', 'note');
  note.id = a.id + 'RedoNote';
  wrap.append(row, note);
  return wrap;
}

function buildLists() {
  const actList = document.getElementById('activityList');
  actList.innerHTML = '';
  ACTIVITIES.forEach(a => {
    actList.append(buildRow(a));
    if (a.redo) actList.append(buildRedoRow(a));
  });

  const examList = document.getElementById('examList');
  examList.innerHTML = '';
  EXAMS.forEach(e => examList.append(buildRow(e)));

  const readList = document.getElementById('readList');
  readList.innerHTML = '';
  READS.forEach(r => {
    const a = el('a', 'box pill');
    a.href = r.href;
    a.append(el('span', 'pill-label', r.label));
    readList.append(a);
  });
}

/* ===== Screens ===== */
const SCREEN_COLORS = { name: 'blue', home: 'blue', activities: 'yellow', exam: 'coral', reads: 'cream' };

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  const panel = document.getElementById('panel');
  const color = SCREEN_COLORS[id] || 'blue';
  panel.className = 'panel ' + color;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--' + color);
  document.documentElement.style.background = bg;
  document.body.style.background = bg;
  if (id !== 'name') { try { sessionStorage.setItem(SCREEN_KEY, id); } catch (e) {} }
}

document.querySelectorAll('[data-go]').forEach(x => {
  x.addEventListener('click', () => showScreen(x.dataset.go));
});

/* ===== Row rendering ===== */
function setRow(item, { score = '—', end = '›', note = '', locked = false, done = false }) {
  const btn = document.getElementById(item.id + 'Btn');
  if (!btn) return;
  document.getElementById(item.id + 'Score').textContent = score;
  document.getElementById(item.id + 'End').textContent = end;
  document.getElementById(item.id + 'Note').textContent = note;
  btn.classList.toggle('locked', locked);
  btn.classList.toggle('done', done);
  if (locked) {
    btn.removeAttribute('href');
    btn.setAttribute('aria-disabled', 'true');
  } else {
    btn.setAttribute('href', item.href);
    btn.removeAttribute('aria-disabled');
  }
}

/* ===== Storage helpers ===== */
function getCookie(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}
function deleteCookie(name) {
  document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
}

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}
async function idbSet(key, value) {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const req = db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(value, key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => resolve(false);
    });
  } catch (e) { return false; }
}
async function idbDelete(key) {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const req = db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).delete(key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => resolve(false);
    });
  } catch (e) { return false; }
}

async function loadActivity(a) {
  let record = null;
  const lsRaw = localStorage.getItem(a.key);
  if (lsRaw) { try { record = JSON.parse(lsRaw); } catch (e) {} }
  if (!record) {
    const cookieRaw = getCookie(a.cookie);
    if (cookieRaw) { try { record = JSON.parse(cookieRaw); } catch (e) {} }
  }
  if (!record) record = await idbGet(a.idbKey);
  return record;
}

async function clearActivity(a) {
  try { localStorage.removeItem(a.key); } catch (e) {}
  try { sessionStorage.removeItem(a.key); } catch (e) {}
  deleteCookie(a.cookie);
  await idbDelete(a.idbKey);
}

/* ===== Activity statuses ===== */
function pctOf(r) {
  if (r.totalScore != null && r.totalMax) return Math.round((r.totalScore / r.totalMax) * 100);
  if (r.percentage != null) return r.percentage;
  const max = r.maxScore || 100;
  return Math.round(((r.score || 0) / max) * 100);
}
function defaultNote(r) {
  if (r.totalScore != null) return `${r.totalScore}/${r.totalMax}`;
  return `${r.score}/${r.maxScore || 100}`;
}

async function refreshActivities() {
  const recs = await Promise.all(ACTIVITIES.map(loadActivity));
  ACTIVITIES.forEach((a, i) => {
    const missing = a.requires.filter(n => !recs[n - 1]);
    if (missing.length) {
      const names = missing.map(n => ACTIVITIES[n - 1].label).join(' and ');
      setRow(a, { end: '🔒', note: `Complete ${names} first`, locked: true });
    } else if (recs[i]) {
      const r = recs[i];
      let note;
      try { note = (a.note || defaultNote)(r); } catch (e) { note = defaultNote(r); }
      let scoreText;
      try { scoreText = a.score ? a.score(r) : pctOf(r) + '%'; } catch (e) { scoreText = pctOf(r) + '%'; }
      setRow(a, { score: scoreText, end: '✓', note, done: true });
    } else {
      setRow(a, { note: 'Not yet attempted' });
    }
    if (a.redo) refreshRedo(a, recs[i]);
  });
}

function refreshRedo(a, record) {
  const row = document.getElementById(a.id + 'RedoRow');
  const btn = document.getElementById(a.id + 'RedoBtn');
  const end = document.getElementById(a.id + 'RedoEnd');
  const note = document.getElementById(a.id + 'RedoNote');
  const used = localStorage.getItem(a.redo.flagKey) === '1';

  if (!record && !used) { row.style.display = 'none'; return; }
  row.style.display = '';
  if (used) {
    btn.disabled = true;
    btn.classList.add('locked');
    end.textContent = '0';
    note.textContent = 'Redo already used';
  } else {
    btn.disabled = false;
    btn.classList.remove('locked');
    end.textContent = '1';
    note.textContent = `One redo available — clears your ${a.label} score`;
  }
}

async function doRedo(a) {
  if (localStorage.getItem(a.redo.flagKey) === '1') return;
  document.getElementById(a.id + 'RedoBtn').disabled = true;
  await clearActivity(a);
  localStorage.setItem(a.redo.flagKey, '1');
  await refreshActivities();
}

/* ===== Exam statuses (read-only; exam pages own the data) ===== */
function examIdbGet(key) {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open(EXAM_IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(EXAM_IDB_STORE); };
      req.onsuccess = () => {
        try {
          const q = req.result.transaction(EXAM_IDB_STORE, 'readonly').objectStore(EXAM_IDB_STORE).get(key);
          q.onsuccess = () => resolve(q.result || null);
          q.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      };
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

function examIdbSet(key, value) {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open(EXAM_IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(EXAM_IDB_STORE); };
      req.onsuccess = () => {
        try {
          const q = req.result.transaction(EXAM_IDB_STORE, 'readwrite').objectStore(EXAM_IDB_STORE).put(value, key);
          q.onsuccess = () => resolve(true);
          q.onerror = () => resolve(false);
        } catch (e) { resolve(false); }
      };
      req.onerror = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}

/* Write an exam record only if it is newer than what this device already has. */
async function applyExamRecord(key, incoming) {
  if (!incoming) return;
  const local = await loadExamRecord(key);
  if (local && (local.updated || 0) >= (incoming.updated || 0)) return;
  try { localStorage.setItem(key, JSON.stringify(incoming)); } catch (e) {}
  await examIdbSet(key, incoming);
}

/* Newest copy across localStorage / sessionStorage / cookie / IndexedDB wins. */
async function loadExamRecord(key) {
  const copies = [];
  try { const s = localStorage.getItem(key); if (s) copies.push(JSON.parse(s)); } catch (e) {}
  try { const s = sessionStorage.getItem(key); if (s) copies.push(JSON.parse(s)); } catch (e) {}
  try { const c = getCookie(key); if (c) copies.push(JSON.parse(c)); } catch (e) {}
  const i = await examIdbGet(key);
  if (i) copies.push(i);
  let best = null;
  copies.forEach(x => { if (x && (!best || (x.updated || 0) > (best.updated || 0))) best = x; });
  return best;
}

async function refreshExam(e) {
  const result = await loadExamRecord(e.prefix + '_result');
  const session = await loadExamRecord(e.prefix + '_session');
  if (result || (session && session.submitted)) {
    setRow(e, { score: '✓', end: 'QR', note: 'Submitted — tap to view QR', done: true });
    return;
  }
  if (session) {
    const total = (session.order && session.order.length) || '?';
    const item = (session.cur || 0) + 1;
    const expired = session.endAt && Date.now() >= session.endAt;
    setRow(e, {
      score: `${item}/${total}`,
      note: expired ? 'Time expired — open to submit' : 'In progress — tap to resume'
    });
    return;
  }
  setRow(e, { note: 'Not yet taken' });
}

function refreshAll() {
  refreshActivities();
  EXAMS.forEach(refreshExam);
}

function enterActivities(name) {
  document.getElementById('greeting').textContent = `Hello, ${name}!`;
  let last = 'home';
  try { last = sessionStorage.getItem(SCREEN_KEY) || 'home'; } catch (e) {}
  if (!SCREEN_COLORS[last] || last === 'name') last = 'home';
  showScreen(last);
  refreshAll();
}

document.getElementById('nameForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  localStorage.setItem(NAME_KEY, name);
  if (!localStorage.getItem(DATE_KEY)) {
    localStorage.setItem(DATE_KEY, new Date().toISOString());
  }
  enterActivities(name);
});

function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}
function isChrome() {
  const ua = navigator.userAgent;
  return /Chrome\//.test(ua) && !/(SamsungBrowser|OPR\/|Edg\/|EdgA\/|Firefox|FxiOS|UCBrowser|MiuiBrowser|HeyTapBrowser|VivoBrowser)/i.test(ua);
}
const browserBlocked = isAndroid() && !isChrome();

/* ===== Encrypted sync (Save / Update) ===== */
async function getSyncCryptoKey() {
  const enc = new TextEncoder();
  const digest = await crypto.subtle.digest('SHA-256', enc.encode(SYNC_KEY));
  return crypto.subtle.importKey('raw', digest, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}
function bufToB64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function b64ToBuf(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

const FIRST_REDO = ACTIVITIES.find(a => a.redo);

async function collectSyncData() {
  const data = {
    name: localStorage.getItem(NAME_KEY),
    createdDate: localStorage.getItem(DATE_KEY),
    redoUsed: FIRST_REDO ? localStorage.getItem(FIRST_REDO.redo.flagKey) === '1' : false,
    redoFlags: {},
    updatedAt: new Date().toISOString()
  };
  for (const a of ACTIVITIES) {
    data[a.id] = await loadActivity(a);
    if (a.redo) data.redoFlags[a.id] = localStorage.getItem(a.redo.flagKey) === '1';
  }
  data.exams = {};
  for (const e of EXAMS) {
    data.exams[e.id] = {
      prefix: e.prefix,
      result: await loadExamRecord(e.prefix + '_result'),
      session: await loadExamRecord(e.prefix + '_session')
    };
  }
  return data;
}

async function applySyncData(data) {
  if (data.name) localStorage.setItem(NAME_KEY, data.name);
  if (data.createdDate) localStorage.setItem(DATE_KEY, data.createdDate);
  if (data.redoFlags) {
    ACTIVITIES.forEach(a => {
      if (a.redo && data.redoFlags[a.id]) localStorage.setItem(a.redo.flagKey, '1');
    });
  } else if (data.redoUsed && FIRST_REDO) {
    localStorage.setItem(FIRST_REDO.redo.flagKey, '1');
  }
  for (const a of ACTIVITIES) {
    if (data[a.id]) {
      localStorage.setItem(a.key, JSON.stringify(data[a.id]));
      await idbSet(a.idbKey, data[a.id]);
    }
  }
  if (data.exams) {
    for (const e of EXAMS) {
      const x = data.exams[e.id];
      if (!x || x.prefix !== e.prefix) continue;
      await applyExamRecord(e.prefix + '_session', x.session);
      await applyExamRecord(e.prefix + '_result', x.result);
    }
  }
  if (data.updatedAt) localStorage.setItem(SYNC_TIMESTAMP_KEY, data.updatedAt);
}

function setSyncStatus(msg, isError) {
  const x = document.getElementById('syncStatus');
  x.textContent = msg;
  x.classList.toggle('error', !!isError);
}

/* ===== Sync folder (File System Access API) ===== */
async function verifyFolderPermission(handle, mode) {
  const opts = { mode };
  try {
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    if ((await handle.requestPermission(opts)) === 'granted') return true;
  } catch (e) {}
  return false;
}
async function getSyncFolderHandle() {
  return await idbGet(SYNC_DIR_HANDLE_KEY);
}
function updateFolderLabel(handle) {
  document.getElementById('folderLabel').textContent = (handle && handle.name)
    ? `Sync folder: ${handle.name}`
    : 'No folder set — Save/Update will use file dialogs.';
}
async function chooseSyncFolder() {
  if (!('showDirectoryPicker' in window)) {
    setSyncStatus('Folder access not supported in this browser.', true);
    return;
  }
  try {
    const handle = await window.showDirectoryPicker();
    const ok = await verifyFolderPermission(handle, 'readwrite');
    if (!ok) { setSyncStatus('Folder permission denied.', true); return; }
    await idbSet(SYNC_DIR_HANDLE_KEY, handle);
    updateFolderLabel(handle);
    setSyncStatus('Sync folder set.');
  } catch (e) { /* cancelled */ }
}
async function restoreFolderLabel() {
  const handle = await getSyncFolderHandle();
  if (handle) updateFolderLabel(handle);
}

function saveSyncFileAsDownload(payload) {
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SYNC_FILENAME;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function saveSyncFile() {
  try {
    const data = await collectSyncData();
    const key = await getSyncCryptoKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const plaintext = new TextEncoder().encode(JSON.stringify(data));
    const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plaintext);
    const payload = { v: 1, iv: bufToB64(iv), data: bufToB64(ciphertext) };

    const dirHandle = await getSyncFolderHandle();
    if (dirHandle && (await verifyFolderPermission(dirHandle, 'readwrite'))) {
      try {
        const fileHandle = await dirHandle.getFileHandle(SYNC_FILENAME, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(payload));
        await writable.close();
        localStorage.setItem(SYNC_TIMESTAMP_KEY, data.updatedAt);
        setSyncStatus('Saved to sync folder.');
        return;
      } catch (e) { /* fall through to download */ }
    }

    saveSyncFileAsDownload(payload);
    localStorage.setItem(SYNC_TIMESTAMP_KEY, data.updatedAt);
    setSyncStatus('Saved: ' + SYNC_FILENAME);
  } catch (e) {
    setSyncStatus('Save failed.', true);
  }
}

async function updateFromFolder() {
  const dirHandle = await getSyncFolderHandle();
  if (dirHandle && (await verifyFolderPermission(dirHandle, 'read'))) {
    try {
      const fileHandle = await dirHandle.getFileHandle(SYNC_FILENAME);
      const file = await fileHandle.getFile();
      await updateFromFile(file);
      return;
    } catch (e) {
      setSyncStatus('No sync file found in the folder yet.', true);
      return;
    }
  }
  document.getElementById('updateFileInput').click();
}

async function updateFromFile(file) {
  try {
    const text = await file.text();
    const payload = JSON.parse(text);
    if (!payload || !payload.iv || !payload.data) throw new Error('bad-format');

    const key = await getSyncCryptoKey();
    const iv = b64ToBuf(payload.iv);
    const ciphertext = b64ToBuf(payload.data);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    const data = JSON.parse(new TextDecoder().decode(plainBuf));

    const localTs = localStorage.getItem(SYNC_TIMESTAMP_KEY);
    if (localTs && data.updatedAt && data.updatedAt <= localTs) {
      setSyncStatus('Already up to date.');
      return;
    }

    await applySyncData(data);
    setSyncStatus('Updated from file.');
    if (data.name) enterActivities(data.name);
    else refreshAll();
  } catch (e) {
    setSyncStatus('Update failed — file is invalid or was tampered with.', true);
  }
}

async function saveOffline() {
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'IT_and_ICT_Activities.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('saveBtn').addEventListener('click', saveSyncFile);
document.getElementById('updateBtn').addEventListener('click', updateFromFolder);
document.getElementById('updateFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) updateFromFile(file);
  e.target.value = '';
});
document.getElementById('chooseFolderBtn').addEventListener('click', chooseSyncFolder);
document.getElementById('saveOfflineBtn').addEventListener('click', saveOffline);

buildLists();
restoreFolderLabel();

/* Refresh statuses when returning via Back (bfcache restore) */
window.addEventListener('pageshow', (e) => {
  if (!e.persisted || browserBlocked) return;
  const savedName = localStorage.getItem(NAME_KEY);
  if (savedName) enterActivities(savedName);
});

/* On load */
(function init() {
  if (browserBlocked) {
    document.getElementById('blockOverlay').style.display = 'block';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    return;
  }
  const savedName = localStorage.getItem(NAME_KEY);
  if (savedName) enterActivities(savedName);
})();
</script>
