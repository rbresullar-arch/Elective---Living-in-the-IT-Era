<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Prelim Examination — Living in the IT Era</title>
<style>
:root{--ink:#000;--paper:#fff;--soft:#555;--line:#000;--maxw:560px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;background:var(--paper);color:var(--ink);height:100%}
body{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit}
:focus-visible{outline:3px solid #000;outline-offset:2px}
.screen{min-height:100dvh;min-height:100vh;display:flex;flex-direction:column}
.pad{max-width:var(--maxw);width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 24px);flex:1;display:flex;flex-direction:column}
h1{font-size:26px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--soft);margin:0;font-size:14px}
.rule{border:0;border-top:2px solid var(--line);margin:18px 0}
.btn{display:block;width:100%;background:#000;color:#fff;border:2px solid #000;border-radius:12px;padding:15px 18px;font-size:17px;min-height:52px;text-align:center}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.28;cursor:default}
.err{color:#000;font-weight:700;margin:10px 0 0;min-height:1.3em;font-size:14px}
.field{display:block;margin:16px 0}
.field span{display:block;font-size:14px;margin-bottom:6px;font-weight:700}
.field input,.field select{width:100%;font-size:17px;padding:14px;border:2px solid #000;border-radius:10px;background:#fff;color:#000;appearance:none}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
.grow{flex:1}
.foot{margin-top:auto;padding-top:20px}
.wcount{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700}
.wtext{font-size:22px;line-height:1.4;margin:18px 0 0}
.wnum{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:2px solid #000;border-radius:50%;font-weight:700;font-size:18px;margin-bottom:6px}
.clue{border:2px solid #000;border-radius:12px;padding:14px;margin:6px 0 2px;text-align:center}
.clue .lab{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700}
.clue .bin{font-family:"Courier New",monospace;font-size:26px;font-weight:700;letter-spacing:.12em;margin-top:6px}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid #000;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 18px 12px}
.bar .who{flex:1;font-weight:700;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .who small{display:block;font-weight:400;font-size:11px;color:var(--soft)}
.timer{font-variant-numeric:tabular-nums;font-size:23px;font-weight:700}
.stage{max-width:var(--maxw);width:100%;margin:0 auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);flex:1;display:flex;flex-direction:column}
.count{font-size:13px;color:var(--soft);margin-bottom:10px}
.mask{position:relative;background:#000;border:2px solid #000;border-radius:14px;padding:20px;min-height:34dvh;display:flex;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.mask .stem{margin:0;font-size:21px;line-height:1.45;visibility:hidden}
.mask .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-size:13px;letter-spacing:.08em;opacity:.85}
.mask.open{background:#fff}
.mask.open .stem{visibility:visible}
.mask.open .hint{display:none}
.choices{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;color:#000;border:2px solid #000;border-radius:12px;padding:14px;font-size:16px;line-height:1.4}
.choice .ltr{flex:0 0 26px;height:26px;border:2px solid currentColor;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.choice .mono{font-family:"Courier New",monospace;font-size:19px;font-weight:700;letter-spacing:.1em}
.choice.sel{background:#000;color:#fff}
.foot2{margin-top:20px}
.qrwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
#qrbox{width:min(72vw,300px);height:min(72vw,300px);border:2px solid #000;border-radius:14px;padding:14px;background:#fff;display:flex;align-items:center;justify-content:center}
#qrbox canvas,#qrbox img{width:100%;height:100%;image-rendering:pixelated}
.qrcap{font-size:13px;color:var(--soft);word-break:break-word}
.qrnote{font-size:13px;color:var(--soft);max-width:300px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="scrWalk" class="screen" hidden>
  <div class="pad">
    <p class="wcount" id="wCount"></p>
    <div class="grow" style="display:flex;flex-direction:column;justify-content:center">
      <span class="wnum" id="wNum"></span>
      <p class="wtext" id="wText"></p>
    </div>
    <div class="foot"><button class="btn" id="wOkay">Okay</button></div>
  </div>
</section>

<section id="scrStart" class="screen" hidden>
  <div class="pad">
    <p class="sub" id="mInst"></p>
    <p class="sub" id="mAddr"></p>
    <hr class="rule">
    <h1 id="mCourse"></h1>
    <p class="sub" id="mDoc"></p>
    <hr class="rule">
    <label class="field"><span>Full name</span><input id="fName" autocomplete="off" autocapitalize="words" enterkeyhint="next"></label>
    <label class="field"><span>Schedule</span>
      <select id="fSched"><option value="" disabled selected>Select your schedule…</option></select>
    </label>
    <div id="gate" hidden>
      <div class="clue">
        <div class="lab">Enter code — decode the binary</div>
        <div class="bin" id="clueBin"></div>
      </div>
      <label class="field"><span>Enter code</span><input id="fCode" inputmode="numeric" autocomplete="off" enterkeyhint="go" placeholder="••••"></label>
    </div>
    <p class="err" id="startErr" role="alert"></p>
    <div class="foot"><button class="btn" id="btnStart">Start examination</button></div>
  </div>
</section>

<section id="scrExam" class="screen" hidden>
  <header class="bar">
    <div class="who" id="whoLine">Prelim<small id="schedLine"></small></div>
    <div class="timer" id="timer" aria-label="Time remaining">60:00</div>
  </header>
  <main class="stage">
    <div class="count" id="itemNo"></div>
    <div class="mask" id="mask" role="button" tabindex="0" aria-label="Press and hold to read the question">
      <p class="stem" id="stem"></p>
      <span class="hint">Press and hold to read</span>
    </div>
    <div class="choices" id="choices"></div>
    <div class="foot2"><button class="btn" id="btnNext" disabled>Next</button></div>
  </main>
</section>

<section id="scrResult" class="screen" hidden>
  <div class="pad">
    <div class="qrwrap">
      <div id="qrbox" aria-label="Result QR code"></div>
      <div class="qrcap" id="qrCap"></div>
      <button class="btn" id="btnDl" style="max-width:300px">Download QR</button>
      <p class="qrnote">If the download does not start, take a screenshot of this QR code.</p>
    </div>
  </div>
</section>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;

/* ---- XOR+Base64 (key 2026) ---- */
function b64e(bytes){var s='';for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function b64d(str){var s=atob(str),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function utf8e(str){return new TextEncoder().encode(str)}
function utf8d(bytes){return new TextDecoder().decode(bytes)}
function xor(bytes,key){var k=utf8e(key),o=new Uint8Array(bytes.length);for(var i=0;i<bytes.length;i++)o[i]=bytes[i]^k[i%k.length];return o}
function encrypt(str,key){return b64e(xor(utf8e(str),key))}
function decrypt(str,key){return utf8d(xor(b64d(str),key))}

var ITEMS=null,KEY=null,TOTAL=0;
function unlock(code){
  try{var o=JSON.parse(decrypt(CIPHER,code));
    if(!o.items||!o.key)return false;ITEMS=o.items;KEY=o.key;TOTAL=ITEMS.length;return true;
  }catch(e){return false}
}

/* ---- compact form for the cookie layer (4 KB limit) ---- */
function pack(o){
  if(!o||!o.order)return o;
  var c={};for(var k in o)if(k!=='order'&&k!=='perms'&&k!=='events')c[k]=o[k];
  c._o=o.order.map(function(n){return (n<36?'0':'')+n.toString(36)}).join('');
  var p='';Object.keys(o.perms||{}).sort(function(a,b){return a-b}).forEach(function(id){p+=o.perms[id].join('')});c._p=p;
  c._e=(o.events||[]).length;
  return c;
}
function unpack(c){
  if(!c||c._o==null)return c;
  var o={};for(var k in c)if(k!=='_o'&&k!=='_p'&&k!=='_e')o[k]=c[k];
  o.order=[];for(var i=0;i<c._o.length;i+=2)o.order.push(parseInt(c._o.substr(i,2),36));
  o.perms={};for(var j=0;j*4<c._p.length;j++)o.perms[j+1]=c._p.substr(j*4,4).split('').map(Number);
  o.events=[];for(var e=0;e<(c._e||0);e++)o.events.push({kind:'restored'});
  return o;
}

/* ---- 4-layer storage: localStorage, cookie, IndexedDB, sessionStorage ---- */
var Store=(function(){
  var dbp=null;
  function db(){if(dbp)return dbp;dbp=new Promise(function(res,rej){try{var r=indexedDB.open('itict_exam',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}});return dbp}
  function idbGet(k){return db().then(function(d){return new Promise(function(res,rej){var q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){rej(q.error)}})}).catch(function(){return null})}
  function idbSet(k,v){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})}).catch(function(){})}
  function idbDel(k){return db().then(function(d){return new Promise(function(res){var t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res})}).catch(function(){})}
  function lsGet(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
  function ssGet(k){try{var s=sessionStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
  function ckGet(k){try{var p=document.cookie.split('; ');for(var i=0;i<p.length;i++)if(p[i].indexOf(k+'=')===0)return unpack(JSON.parse(decodeURIComponent(p[i].slice(k.length+1))))}catch(e){}return null}
  function ckSet(k,o){try{var s=encodeURIComponent(JSON.stringify(pack(o)));if(s.length<3800)document.cookie=k+'='+s+';max-age=172800;path=/;SameSite=Lax'}catch(e){}}
  function writeSync(k,o){var s=JSON.stringify(o);try{localStorage.setItem(k,s)}catch(e){}try{sessionStorage.setItem(k,s)}catch(e){}ckSet(k,o)}
  function load(k){
    /* full copies are listed first so a tie prefers them over the compact cookie */
    var c=[lsGet(k),ssGet(k),ckGet(k)];
    return idbGet(k).then(function(v){c.splice(2,0,v);var best=null;
      c.forEach(function(x){if(x&&(!best||(x.updated||0)>(best.updated||0)))best=x});
      if(best){writeSync(k,best);idbSet(k,best)}return best})}
  function save(k,o){o.updated=Date.now();writeSync(k,o);idbSet(k,o)}
  function clear(k){try{localStorage.removeItem(k)}catch(e){}try{sessionStorage.removeItem(k)}catch(e){}try{document.cookie=k+'=;max-age=0;path=/'}catch(e){}return idbDel(k)}
  return{load:load,save:save,clear:clear};
})();

/* ---- state ---- */
var S=null,active=false,cur=0,tickT=null,beatT=null,picked=null;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function curItem(){return ITEMS[S.order[cur]]}
function fmtClock(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function showOnly(id){['scrWalk','scrStart','scrExam','scrResult'].forEach(function(x){$(x).hidden=(x!==id)})}

/* ---- walkthrough ---- */
var WALK=[
 "Do not clear your browser data or delete the examination file until your QR code is saved.",
 "Fill in your name and choose your schedule.",
 "The examination runs on a one-hour timer.",
 "Press and hold the black question field to show each question.",
 "You cannot go back to a question once you have entered an answer and tapped Next.",
 "Switching or closing tabs is monitored. One point is deducted for each flag.",
 "Save your QR code at the end of the examination."
];
var wIdx=0;
function showWalk(){wIdx=0;renderWalk();showOnly('scrWalk')}
function renderWalk(){
  $('wCount').textContent='Instruction '+(wIdx+1)+' of '+WALK.length;
  $('wNum').textContent=(wIdx+1);
  $('wText').textContent=WALK[wIdx];
  $('wOkay').textContent=(wIdx===WALK.length-1)?'Okay — continue':'Okay';
}
$('wOkay').addEventListener('click',function(){
  if(wIdx<WALK.length-1){wIdx++;renderWalk()}else showStart();
});

/* ---- start / gate ---- */
function toBin(n){return (n>>>0).toString(2)}
function fillSched(){
  var sel=$('fSched');
  META.schedules.forEach(function(s){
    var o=document.createElement('option');o.value=s.code;
    o.textContent=s.code+' — '+s.title+' — '+s.time+' — '+s.days;
    sel.appendChild(o);
  });
}
function showStart(){
  $('mInst').textContent=META.institution;
  $('mAddr').textContent=META.address;
  $('mCourse').textContent=(META.course_code?META.course_code+' ':'')+META.course;
  $('mDoc').textContent=META.assessment+' '+META.document_type;
  $('clueBin').textContent=toBin(Number(CODE));
  showOnly('scrStart');
}
$('fSched').addEventListener('change',function(){if($('fSched').value){$('gate').hidden=false}});
$('btnStart').addEventListener('click',function(){
  var n=$('fName').value.trim(),sc=$('fSched').value,code=$('fCode').value.trim();
  if(!n){$('startErr').textContent='Enter your full name.';return}
  if(!sc){$('startErr').textContent='Choose your schedule.';return}
  if($('gate').hidden){$('gate').hidden=false;$('startErr').textContent='Enter the code to begin.';return}
  if(code!==CODE||!unlock(code)){$('startErr').textContent='Incorrect code.';return}
  var now=Date.now();
  var order=[];for(var oi=0;oi<TOTAL;oi++)order.push(oi);
  shuffle(order);
  var perms={};ITEMS.forEach(function(it){var p=[0,1,2,3];shuffle(p);perms[it.id]=p});
  S={v:1,name:n,sched:sc,startAt:now,endAt:now+CFG.minutes*60000,answers:{},cur:0,events:[],lastSeen:now,away:null,submitted:false,order:order,perms:perms};
  Store.save(K_S,S);
  enterExam();
});

/* ---- exam (forward-only) ---- */
function enterExam(){
  if(!ITEMS&&!unlock(CODE)){return}
  if(!S.order||S.order.length!==TOTAL){var o=[];for(var i=0;i<TOTAL;i++)o.push(i);S.order=o}
  if(!S.perms){S.perms={}}
  ITEMS.forEach(function(it){if(!S.perms[it.id])S.perms[it.id]=[0,1,2,3]});
  showOnly('scrExam');
  $('schedLine').textContent=S.sched;
  cur=Math.min(Math.max(S.cur||0,0),TOTAL-1);
  active=true;render();tick();
  clearInterval(tickT);tickT=setInterval(tick,250);
  clearInterval(beatT);beatT=setInterval(beat,1000);
}
function tick(){if(!S||S.submitted)return;var left=S.endAt-Date.now();$('timer').textContent=fmtClock(left);if(left<=0)submit(true)}
function beat(){if(!S||S.submitted)return;S.lastSeen=Date.now();Store.save(K_S,S)}
function isCode(t){return /^[0-9]+$/.test(t)}
function render(){
  var it=curItem();picked=null;
  var perm=S.perms[it.id];
  $('itemNo').textContent='Item '+(cur+1)+' of '+TOTAL;
  $('stem').textContent=it.q;hideMask();
  var box=$('choices');box.innerHTML='';
  perm.forEach(function(origIdx,pos){
    var b=document.createElement('button');b.type='button';b.className='choice';
    b.setAttribute('data-pos',pos);
    var l=document.createElement('span');l.className='ltr';l.textContent=LET[pos];
    var t=document.createElement('span');t.textContent=it.c[origIdx];
    if(isCode(it.c[origIdx]))t.className='mono';
    b.appendChild(l);b.appendChild(t);
    b.addEventListener('click',function(){pick(pos,LET[origIdx])});
    box.appendChild(b);
  });
  $('btnNext').disabled=true;
  $('btnNext').textContent=(cur===TOTAL-1)?'Submit':'Next';
  S.cur=cur;
}
function pick(pos,origLetter){
  picked=origLetter;
  var bs=$('choices').children;
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle('sel',bs[i].getAttribute('data-pos')==String(pos));
  $('btnNext').disabled=false;
}
$('btnNext').addEventListener('click',function(){
  if(picked==null)return;
  var it=curItem();S.answers[it.id]=picked;
  if(cur===TOTAL-1){Store.save(K_S,S);submit(false)}else{cur++;render();Store.save(K_S,S)}
});

/* ---- mask hold-to-reveal ---- */
var mask=$('mask');
function showMask(){mask.classList.add('open')}
function hideMask(){mask.classList.remove('open')}
mask.addEventListener('pointerdown',function(e){if(e.button!==undefined&&e.button>0)return;try{mask.setPointerCapture(e.pointerId)}catch(x){}showMask()});
['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(function(ev){mask.addEventListener(ev,hideMask)});
mask.addEventListener('contextmenu',function(e){e.preventDefault()});
mask.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();showMask()}});
mask.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')hideMask()});
mask.addEventListener('blur',hideMask);
document.addEventListener('copy',function(e){if(active)e.preventDefault()});

/* ---- silent flags ---- */
function awayStart(kind){if(!active||!S||S.submitted)return;if(!S.away){S.away={start:Date.now(),kinds:[kind]};Store.save(K_S,S)}else if(S.away.kinds.indexOf(kind)<0){S.away.kinds.push(kind);Store.save(K_S,S)}}
function awayEnd(){if(!active||!S||!S.away)return;if(document.hidden||(document.hasFocus&&!document.hasFocus()))return;var a=S.away,now=Date.now();S.away=null;S.events.push({kind:'switch',via:a.kinds.join('+'),from:a.start,to:now,dur:now-a.start});Store.save(K_S,S)}
document.addEventListener('visibilitychange',function(){hideMask();if(document.hidden)awayStart('tab');else awayEnd()});
window.addEventListener('blur',function(){hideMask();awayStart('window')});
window.addEventListener('focus',awayEnd);
window.addEventListener('pagehide',function(){if(S&&!S.submitted){S.lastSeen=Date.now();Store.save(K_S,S)}});
function resume(){
  var now=Date.now();
  if(S.away){var ls=S.lastSeen||S.away.start;if(ls-S.away.start>2000)S.events.push({kind:'switch',via:S.away.kinds.join('+'),from:S.away.start,to:ls,dur:ls-S.away.start});S.away=null}
  var from=S.lastSeen||now;S.events.push({kind:'closed',from:from,to:now,dur:now-from});S.lastSeen=now;Store.save(K_S,S);
  if(now>=S.endAt)submit(true);else enterExam();
}

/* ---- submit ---- */
function submit(auto){
  if(!S||S.submitted)return;
  clearInterval(tickT);clearInterval(beatT);
  var now=Date.now();
  if(S.away){S.events.push({kind:'switch',via:S.away.kinds.join('+'),from:S.away.start,to:now,dur:now-S.away.start});S.away=null}
  active=false;
  var score=0;ITEMS.forEach(function(it){if(S.answers[it.id]===KEY[it.id])score++});
  var R={v:1,name:S.name,sched:S.sched,startAt:S.startAt,endAt:Math.min(now,S.endAt),
    score:score,total:TOTAL,flags:S.events.length,auto:!!auto};
  Store.save(K_R,R);S.submitted=true;Store.save(K_S,S);
  showResult(R,true);
}

/* ---- QR result (payload format read by qr_scanner.py) ---- */
function qrPayload(R){
  var o={v:1,name:R.name,sched:R.sched,score:R.score,total:R.total,
    start:new Date(R.startAt).toISOString(),end:new Date(R.endAt).toISOString(),flags:R.flags};
  return encrypt(JSON.stringify(o),CODE);
}
function makeQR(text){
  var q=qrcode(0,'M');q.addData(text);q.make();
  var n=q.getModuleCount(),cell=8,margin=cell*2,size=n*cell+margin*2;
  var cv=document.createElement('canvas');cv.width=size;cv.height=size;
  var ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#000';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(margin+c*cell,margin+r*cell,cell,cell);
  return cv;
}
var lastPNG=null,lastName='student';
function showResult(R,doAuto){
  active=false;showOnly('scrResult');
  lastName=(R.name||'student').replace(/[^\w-]+/g,'_')||'student';
  var cv=makeQR(qrPayload(R));
  var box=$('qrbox');box.innerHTML='';box.appendChild(cv);
  $('qrCap').textContent=R.name+' · '+R.sched;
  try{lastPNG=cv.toDataURL('image/png')}catch(e){lastPNG=null}
  if(doAuto)downloadPNG();
}
function downloadPNG(){
  if(!lastPNG)return;
  var a=document.createElement('a');a.href=lastPNG;a.download='GEEL1_'+CFG.label+'_'+lastName+'.png';
  document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},400);
}
$('btnDl').addEventListener('click',downloadPNG);

/* ---- init ---- */
fillSched();
Store.load(K_R).then(function(R){
  if(R){showResult(R,false);return}
  return Store.load(K_S).then(function(s){
    if(s&&!s.submitted){if(!unlock(CODE))return showWalk();S=s;resume()}
    else showWalk();
  });
});
})();

</script>
