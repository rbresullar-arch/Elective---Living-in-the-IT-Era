<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Internet: Packet Auto-Route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=League+Spartan:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#000000; --muted:#555555; --fill:#f1f1f1; --fill2:#e6e6e6;
  --ok:#15933a; --bad:#d4151b; --line:#a8a8a8; --bolt:#00b4ff;
  --log:#8bc34a; --disc:#4fd3e3; --go:#bde3b8;
  --display:'Bebas Neue','Anton',Impact,'Arial Narrow',sans-serif;
  --body:'League Spartan','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.3}
button{font-family:inherit;color:inherit}
main{max-width:480px;height:100%;margin:0 auto;padding:12px 14px 12px;display:flex;flex-direction:column;gap:10px}

.top{display:flex;align-items:baseline;justify-content:space-between}
h1{font-family:var(--body);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:-.01em}
.top-r{display:flex;align-items:center;gap:8px}
.mute{background:var(--fill);border:none;border-radius:10px;font-size:1.1rem;line-height:1;padding:6px 8px;cursor:pointer}
.clock{font-size:.9rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:8px}
.sq{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:0;cursor:pointer}
.sq .lbl{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;line-height:1}
.sq .box{width:40px;height:34px;border-radius:6px;display:block}
.sq.log .box{background:var(--log)}
.sq.disc .box{background:var(--disc)}
.pts{text-align:center;line-height:1}
.pts small{display:block;font-size:.62rem;font-weight:800;letter-spacing:.06em;color:#1a2aa0}
.pts b{font-family:var(--display);font-size:2.6rem;font-weight:400;font-variant-numeric:tabular-nums}
.pts .cr{display:block;font-size:.85rem;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.file-box{position:absolute;top:8px;left:8px;z-index:2;background:#0b1030;border-radius:8px;padding:4px 4px 2px;pointer-events:none}
.file-box canvas{display:block;width:96px;height:80px;image-rendering:pixelated;image-rendering:crisp-edges}
.file-box span{display:block;color:#fff;font-size:.7rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.file-big{display:block;width:100%;max-width:300px;aspect-ratio:6/5;margin:0 auto 12px;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:10px}

#banner{font-family:var(--display);font-size:2.5rem;line-height:1;letter-spacing:.02em;text-align:center;padding:10px 12px 6px;border:none;border-radius:14px;background:var(--fill);cursor:default;width:100%}
#banner.warn{background:#ffe7a8}
#banner.danger{background:var(--bad);color:#fff}
#banner.action{background:var(--bad);color:#fff;cursor:pointer;animation:pulse 1s ease-in-out infinite}
#banner small{display:block;font-family:var(--body);font-size:.85rem;font-weight:700;letter-spacing:0;margin-top:2px}
@keyframes pulse{50%{filter:brightness(1.25)}}

.board-box{flex:1;min-height:0;background:var(--fill);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
svg{width:100%;height:100%;display:block}
.node text{pointer-events:none;user-select:none;-webkit-user-select:none}
.node text.tag{font-size:13px;fill:var(--muted);text-anchor:middle}
.node{cursor:default}
.node.broken circle.core{fill:var(--bad)}
.node.targeted{cursor:pointer}
.node-hit{fill:transparent}
.edge{stroke:var(--line);stroke-width:2}
.edge.on{stroke:var(--bolt);stroke-width:4}
.down-veil{fill:#000;opacity:0}
svg.down .down-veil{opacity:.55}
.down-text{font-size:26px;font-weight:700;fill:#fff;text-anchor:middle;opacity:0}
svg.down .down-text{opacity:1}
.pop{font-size:30px;text-anchor:middle;pointer-events:none}
.down-veil,.down-text,.no-hit{pointer-events:none}
.sw{cursor:pointer}
.sw-hit{fill:transparent}
.sw-ring{fill:none;stroke:var(--bad);stroke-width:4}
.sw-fin{font-size:26px;text-anchor:middle}
.sw-tag{font-size:14px;font-weight:700;fill:var(--bad);text-anchor:middle}

.bottom{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.quick{background:var(--fill);border-radius:14px;padding:10px 12px;min-height:84px}
.quick .row1{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:1rem}
.quick .row1 .cost{white-space:nowrap}
.quick .yr{font-size:.82rem;font-weight:700;color:var(--muted);margin:1px 0 3px}
.quick .desc{font-size:.85rem;line-height:1.25}
#discover{font-weight:800;font-size:1rem;background:var(--go);border:none;border-radius:18px;padding:16px 14px;cursor:pointer;min-width:96px}
#discover:disabled{opacity:.45;cursor:default}
.go-col{display:flex;gap:8px;align-items:center}
.home-start{display:none;font-weight:800;font-size:1rem;color:#000;text-decoration:none;background:var(--fill2);border-radius:18px;padding:16px 14px;min-width:80px;text-align:center}
body.idle .home-start{display:block}
#discover:focus-visible,#banner:focus-visible,.sq:focus-visible{outline:3px solid #7aa7ff;outline-offset:3px}

.panel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 100px calc(24px + env(safe-area-inset-bottom,0px)) 16px}
.panel[hidden]{display:none}
.panel h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 4px;letter-spacing:.02em}
.panel .sub{margin:0 0 12px;color:var(--muted)}
.log p{margin:0 0 6px;font-size:.95rem}
.log p:first-child{font-weight:700}
.panel-links{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.panel-links a,.panel-links button{font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);background:var(--fill);border:none;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}
.inv-row{background:var(--fill);border-radius:12px;margin:0 0 8px;padding:8px 10px}
.inv-row.have{background:#e3f3e1}
